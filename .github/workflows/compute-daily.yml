# 매일 점수·유형 판정 (FR-SCORE · FR-TYPE). 보조 자료 수집(05:40 KST)이 끝나면 이어서 실행한다 — 약 06:00 KST.
# Cloudflare Cron 5개를 모두 쓰고 있어 workflow_run 으로 잇는다. 앞 작업이 실패해도 직전 자료로 계산한다(FR-DATA-11)
name: compute-daily

on:
  workflow_run:
    workflows: [collect-aux-daily]
    types: [completed]
    branches: [main]
  # 보조 수집이 돌지 않은 날을 위한 보조 예약(07:15 KST). 두 번 돌면 그 사이 쌓인 자료로 다시 계산할 뿐이다
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # 주간 리포트의 실행 시간 집계(NFR-COST-04)

concurrency:
  group: data-compute
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # LLM 단계는 코드 안 시간 예산(LLM_DEADLINE_MIN, 기본 10분)으로 스스로 끝낸다. 단계별 제한은 그래도 멈출 때의 안전장치
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute
        run: npm run compute:daily
      # 근거 문장·후기 판정(4단계). 키가 없으면 건너뛰고 정형 문장을 쓴다. 후기 판정 → 계산(숨은 클래식 반영) → 근거 문장 → 계산(문장 반영)
      # 이 단계들이 실패해도 정형 문장으로 발행은 계속한다(continue-on-error)
      - name: LLM reviews
        continue-on-error: true
        timeout-minutes: 15
        run: npm run llm:daily
        env:
          LLM_MODE: reviews
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: Compute (with reviews)
        run: npm run compute:daily
      - name: LLM reasons
        continue-on-error: true
        timeout-minutes: 15
        run: npm run llm:daily
        env:
          LLM_MODE: reasons
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Compute (with reasons)
        run: npm run compute:daily
      # 주간 품질 리포트(FR-OPS-02) — 지난주 리포트가 없을 때만 만든다(월요일 첫 실행). 실패해도 발행은 계속
      - name: Weekly report
        continue-on-error: true
        run: npm run report:weekly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 화면용 공개 자료는 public-data 브랜치에 한 커밋으로 덮어쓴다 — main 이력이 매일 수 MB씩 커지지 않게.
      # 이 브랜치는 생성물만 담는 자료 전용 브랜치라 강제 덮어쓰기가 의도된 동작이다. 화면 Worker 가 이 브랜치를 읽는다
      - name: Publish screen data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public-out
          git init -q -b public-data
          git config user.name "hansan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "public data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" public-data
      - name: Commit data
        run: |
          git config user.name "hansan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/scores data/recommendations data/state/exposure.json data/state/llm data/state/usage data/state/rec-log data/reports docs/reports/weekly
          git diff --cached --quiet && exit 0
          git commit -m "data: compute-daily $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
