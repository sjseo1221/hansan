# 서울 실시간 인구 매시간 수집 트리거 (Cloudflare Workers 무료 플랜 Cron Trigger)
name = "hansan-cron"
main = "index.js"
compatibility_date = "2026-10-01"

# workers_dev=true: 첫 배포(false)에서 "No targets deployed" 가 나와 켰다. false 에서 Cron 이 안 도는지는 확인하지 않았다.
# fetch 처리기가 없어 주소로 호출해도 동작하지 않는다(500). Cron 설정 변경은 반영까지 최대 15분 걸린다
workers_dev = true
preview_urls = false

[triggers]
# index.js 의 SCHEDULE 표와 같은 문자열 (UTC). 무료 플랜은 계정당 5개까지
crons = ["17 * * * *", "30 19 * * *", "50 19 * * sun", "23 20 * * *", "40 20 * * *"]

[vars]
REPO = "sjseo1221/hansan"
