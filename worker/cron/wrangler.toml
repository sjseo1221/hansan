# 서울 실시간 인구 매시간 수집 트리거 (Cloudflare Workers 무료 플랜 Cron Trigger)
name = "hansan-cron"
main = "index.js"
compatibility_date = "2026-10-01"

# workers_dev=false 면 배포 대상이 없어 Cron 이 돌지 않았다(2026-10-12 확인). fetch 처리기가 없어 주소로 호출해도 동작하지 않는다
workers_dev = true
preview_urls = false

[triggers]
crons = ["17 * * * *"]

[vars]
REPO = "sjseo1221/hansan"
WORKFLOW = "collect-seoul-hourly.yml"
