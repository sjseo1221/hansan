# 출처별 호출 설정 (FR-DATA-10). 값을 바꾸면 다음 실행부터 적용된다.
# dailyCap: 하루(KST) 최대 호출 수. 닿으면 남은 장소는 다음 실행으로 넘긴다.

seoul_citydata:
  # 서울 열린데이터광장 실시간 인구 (OA-21778). https 미지원 — http 만 동작 (2026-10-11 실호출 확인)
  baseUrl: http://openapi.seoul.go.kr:8088
  service: citydata_ppltn
  # 미등록 인증키의 하루 한도는 아직 공식 확인 전. 확인되면 그 90% 로 맞춘다.
  # 121곳 × 24회 = 2,904건이 필요하다.
  dailyCap: 3000
  timeoutMs: 10000
  concurrency: 4

naver:
  # NAVER API HUB (2026-10-11 실호출 확인). 공식 한도: 검색 하루 25,000·월 775,000, 데이터랩 월 50,000
  # 앱 상한은 공식 한도의 절반 이하로 둔다(유료 전환 대비). 콘솔 월 사용량 상한도 함께 설정한다.
  blogDailyCap: 2000
  trendDailyCap: 800
  blogDisplay: 30          # 최신 게시일 표본 수(1~100)
  anchorKeyword: 경복궁    # 모든 트렌드 요청에 넣는 기준 키워드 — 바꾸면 백필을 다시 받아야 한다
  backfillStart: "2016-01-01"
  recentWeeks: 13
  timeoutMs: 15000
  timeBudgetMs: 1200000   # 한 실행 최대 20분 — 넘으면 남은 호출을 멈추고 정상 커밋(job timeout 30분 전에)

cnctr:
  # 한국관광공사 관광지 집중률 예측 (FR-DATA-02). 개발계정 하루 1,000건 → 앱 상한 900. 시·군·구당 1호출(2026-10-12 확인)
  dailyCap: 900

tour:
  # TourAPI v2(KorService2). 하루 한도는 미확인(사용자 면제) — 합계 900 을 작업별로 나눈다(2차 리뷰: 한 카운터를 세 작업이 나눠 쓰다 소진)
  caps: { build: 150, events: 50, operation: 700 }
  # 장소 후보 콘텐츠 유형: 12 관광지 · 14 문화시설 · 28 레포츠 · 15 축제공연행사, 38 쇼핑은 신분류 SH06(시장)만
  types:
    - { contentTypeId: "12" }
    - { contentTypeId: "14" }
    - { contentTypeId: "28" }
    - { contentTypeId: "15" }
    - { contentTypeId: "38", keepLcls2: [SH06] }

aux:
  # 보조 자료 하루 상한(호출 수). 공식 한도 미확인 — 사용자 면제(2026-10-12), 실패 기록으로 사후 감지
  datalabDailyCap: 50      # 지역별 방문자수: 하루 1~3회면 충분
  kmaDailyCap: 400         # 기상청 단기(시군구 대표 격자 약 150) + 중기 5
  kasiDailyCap: 20         # 공휴일: 월 3회
  visitorsFirstLookbackDays: 60   # 첫 실행에서 거슬러 받을 기간(공개가 약 33일 늦음)
  eventsHorizonDays: 14           # FR-FLT-01 날짜 선택 범위와 같게
  holidayMonths: 3

# 제공처 무료 한도 (docs/sources.md, 2026-10-12 확인). 우리 상한(위 cap·dailyCap)이 이 값을 넘지 않는지 시험으로 확인한다(NFR-COST-02),
# 주간 리포트는 실제 사용량이 이 값의 80% 에 닿으면 경고한다(FR-OPS-08). per: day | month
freeLimits:
  tour: { limit: 1000, per: day, counters: [tour_build, tour_events, tour_operation], note: "TourAPI KorService2 개발계정 — 기능 합산으로 보임" }
  cnctr: { limit: 1000, per: day, counters: [cnctr] }
  datalab: { limit: 1000, per: day, counters: [datalab] }
  kma: { limit: 10000, per: day, counters: [kma] }
  kasi: { limit: 10000, per: day, counters: [kasi] }
  seoul_citydata: { limit: 3000, per: day, counters: [seoul_citydata], note: "미등록 키 한도 미확인 — 우리 상한을 한도로 본다" }
  naver_search: { limit: 25000, per: day, counters: [naver_blog, naver_blog_llm], note: "API HUB 정오표 25,000/일(월 775,000 과 상충 — 보수적으로)" }
  naver_trend: { limit: 50000, per: month, counters: [naver_trend] }
