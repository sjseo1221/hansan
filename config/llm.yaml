# OpenAI 사용 설정 (FR-LLM, FR-CHAT, NFR-COST-03) — 모델·예산은 2026-10-11 발주자 승인
model: gpt-6-luna

budget:
  monthlyUsd: 20      # OpenAI 계정에도 같은 한도를 설정한다
  appCutoffUsd: 15    # 앱 누적 비용이 이 값에 닿으면 대화만 닫는다(피드·상세는 계속)

reason:               # 근거 문장 (FR-LLM-01)
  maxSentences: 2
  maxChars: 100

review:               # 후기 판정 (FR-LLM-03)
  minReviews: 5       # 미만이면 판단 보류

retry:
  invalidJson: 1      # 형식 오류 시 1회 재시도 후 비움 (FR-LLM-06)

chat:
  perUserDaily: 20    # FR-CHAT-08
  serviceDaily: 500   # FR-CHAT-09 서비스 전체 상한 — 착수 계획서 가정값
  maxInputChars: 200  # FR-CHAT-10
  timeoutSec: 10      # FR-CHAT-12
  maxCards: 5         # FR-CHAT-04

# 단가 (USD / 100만 토큰, 2026-10-10 공식 가격표 — kickoff-plan 4.1) — 호출 비용 기록(FR-LLM-10)·예산 판정에 쓴다
price:
  input: 0.10
  cachedInput: 0.01
  output: 0.50

# 근거 생성(주기 작업) 상한 — 대화 예산과 별도로 생성 비용이 월 예산을 다 쓰지 않게
generation:
  reasoningEffort: none     # 짧은 문장이라 추론 토큰(출력 과금)을 쓰지 않는다
  maxCallsPerRun: 1500
  monthlyUsd: 5             # 생성 누적 비용이 이 값에 닿으면 그 달은 정형 문장만. 생성 5 + 대화 차단선 15 = 월 예산 20 (시험으로 고정)
  reviewRefreshDays: 7      # 후기 판정 재사용 기간
  reviewBlogCalls: 300      # 후기 판정용 네이버 블로그 검색 하루 상한(수집 상한과 별도 카운터)
