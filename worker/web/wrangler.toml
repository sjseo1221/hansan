# 한산 화면 (3단계) — workers.dev 무료 주소. 배포: npm run build:web && (이 폴더에서) npx wrangler deploy
name = "hansan-web"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../../web/dist"
binding = "ASSETS"
# /data/* 만 Worker 가 처리하고 나머지는 정적 파일을 바로 내보낸다(Worker 요청 수를 아낀다)
run_worker_first = ["/data/*"]

[vars]
REPO = "sjseo1221/hansan"
