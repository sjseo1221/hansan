# 대상 지역 (RFP 2절: 수도권·강원·충청, 충청권 = 충북·충남·대전·세종 — 2026-10-11 발주자 결정)
# code: 법정동코드 시·도 2자리.
# 시·군·구 목록과 대표 좌표(FR-FLT-02 출발 지역)는 추측해 쓰지 않는다 — 공공 원천(행정표준코드·TourAPI 지역 코드)에서
# 받아 data/sources/regions/ 에 저장하는 수집 작업으로 채운다(키 수령 후). 인천은 2026-07-01 행정체제 개편 반영 여부를 그때 확인한다.

provinces:
  - { code: "11", name: 서울특별시 }
  - { code: "28", name: 인천광역시 }
  - { code: "41", name: 경기도 }
  - { code: "51", name: 강원특별자치도 }
  - { code: "43", name: 충청북도 }
  - { code: "44", name: 충청남도 }
  - { code: "30", name: 대전광역시 }
  - { code: "36", name: 세종특별자치시 }

# 이동 시간 어림 (FR-FLT-02): 직선거리 × detourFactor ÷ speedKmh, 화면에는 '약'을 붙인다
# 계수는 착수 계획서 C-2 가정값
travel:
  detourFactor: 1.3
  speedKmh: 40
  options: [30, 60, 120, null]   # 분, null = 제한 없음

# 집중률 API 가 TourAPI 시·군·구 목록에 없는 코드로 응답하는 경우의 추가 후보 (2026-10-12 사전 확인)
# 인천은 2026-07 행정체제 개편 후에도 집중률이 개편 전 코드(28110 중구 등)로 응답한다. 응답이 없는 코드는 수집기가 자동으로 비활성 처리한다.
cnctrExtraSigungu:
  - { code: "28110", name: 인천 중구(개편 전) }
  - { code: "28140", name: 인천 동구(개편 전) }
  - { code: "28260", name: 인천 서구(개편 전) }
