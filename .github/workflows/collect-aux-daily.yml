# 보조 자료 매일 수집: 방문자수(FR-DATA-03)·행사·날씨·공휴일(FR-DATA-08)·운영 정보(FR-DATA-09). 05:40 KST = 20:40 UTC (기상청 05시 발표 뒤)
# 예약 실행은 Cloudflare Worker hansan-cron 이 workflow_dispatch 로 실행한다(GitHub schedule 없음)
name: collect-aux-daily

on:
  # 예약은 Cloudflare Worker hansan-cron 하나로만 실행한다(GitHub schedule 과 겹쳐 두 번 돌던 문제, 2차 리뷰)
  workflow_dispatch:
    inputs:
      only:
        description: "일부 단계만 (예: hub, events). 비우면 전부"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-aux
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run
        run: npm run collect:aux
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          AUX_ONLY: ${{ inputs.only }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "hansan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: collect-aux-daily $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
