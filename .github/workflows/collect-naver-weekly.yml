# 네이버 검색어 트렌드·블로그 주 1회 수집 (FR-DATA-06·07). 월 05:23 KST = 일 20:23 UTC (장소 목록 생성 뒤)
name: collect-naver-weekly

on:
  schedule:
    - cron: "23 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        run: npm run collect:naver
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "hansan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: naver $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
